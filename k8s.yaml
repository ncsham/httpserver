kind: Deployment
apiVersion: apps/v1
metadata:
  name: gohttpserver
  namespace: default
  labels:
    app.kubernetes.io/name: gohttpserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gohttpserver
  template:
    metadata:
      name: gohttpserver
      labels:
        app.kubernetes.io/name: gohttpserver
    spec:
      containers:
        - name: gohttpserver
          image: httpserver
          resources:
            requests:
              memory: 50Mi
            limits:
              memory: 100Mi
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 20
      dnsPolicy: ClusterFirst
---
kind: Service
apiVersion: v1
metadata:
  name: gohttpserver
  namespace: default
  labels:
    app.kubernetes.io/name: gohttpserver
spec:
  selector:
    app.kubernetes.io/name: gohttpserver
  type: ClusterIP
  ports:
  - name: traffic-port
    protocol: TCP
    port: 20000
    targetPort: 20000
  - name: metrics
    protocol: TCP
    port: 20001
    targetPort: 20001
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: gohttpserver
  name: gohttpserver
  namespace: default
spec:
  endpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: gohttpserver